<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration - Agritech</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'DM Sans', sans-serif; }
  .form-input { width:100%; border:1px solid #e5e7eb; border-radius:.5rem; padding:.5rem .75rem; font-size:13px; }
  .form-input:focus { outline:none; border-color:#60a5fa; box-shadow:0 0 0 2px #dbeafe; }
  .form-label { display:block; margin-bottom:.25rem; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:#9ca3af; }
</style>
</head>
<body class="flex h-screen bg-[#f4f5f7] text-gray-900 overflow-hidden">

<aside id="sidebar" class="w-56 min-w-[220px] bg-white border-r border-gray-200 flex flex-col shrink-0">
  <div class="flex items-center gap-2 px-5 py-6 border-b border-gray-200">
    <div class="w-2 h-2 rounded-full bg-blue-600 shrink-0"></div>
    <span class="text-[17px] font-semibold whitespace-nowrap">Agritech</span>
  </div>
  <nav class="flex-1 p-2 overflow-y-auto">
    <p class="text-[10px] font-semibold uppercase tracking-widest text-gray-400 px-2 pt-3 pb-1">Overview</p>
    <a href="/" class="flex items-center gap-2 px-3 py-2 rounded-lg text-[13px] text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors">Dashboard</a>

    <p class="text-[10px] font-semibold uppercase tracking-widest text-gray-400 px-2 pt-4 pb-1">Monitoring</p>
    <a href="/alerts" class="flex items-center gap-2 px-3 py-2 rounded-lg text-[13px] text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors">Alerts</a>
    <a href="/alerts?status=incident" class="flex items-center gap-2 px-3 py-2 rounded-lg text-[13px] text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors">Incidents</a>
    <a href="/sensors" class="flex items-center gap-2 px-3 py-2 rounded-lg text-[13px] text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors">Sensors</a>
    <a href="/reports" class="flex items-center gap-2 px-3 py-2 rounded-lg text-[13px] text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors">Reports</a>

    <p class="text-[10px] font-semibold uppercase tracking-widest text-gray-400 px-2 pt-4 pb-1">Explore</p>
    <a href="/maps" class="flex items-center gap-2 px-3 py-2 rounded-lg text-[13px] text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors">Map</a>

    <p class="text-[10px] font-semibold uppercase tracking-widest text-gray-400 px-2 pt-4 pb-1">Intelligence</p>
    <a href="/ai" class="flex items-center gap-2 px-3 py-2 rounded-lg text-[13px] text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors">Analysis</a>

    <p class="text-[10px] font-semibold uppercase tracking-widest text-gray-400 px-2 pt-4 pb-1">System</p>
    <a href="/admin" class="flex items-center gap-2 px-3 py-2 rounded-lg text-[13px] bg-blue-50 text-blue-600 font-medium">Administration</a>
    <a href="/settings" class="flex items-center gap-2 px-3 py-2 rounded-lg text-[13px] text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors">Settings</a>
  </nav>
</aside>

<div class="flex-1 flex flex-col overflow-hidden">
  <header class="flex items-center justify-between px-5 py-3.5 bg-white border-b border-gray-200 shrink-0">
    <h2 class="text-[15px] font-semibold text-gray-900">System Administration</h2>
    <div class="flex items-center gap-3">
      <div aria-label="Admin profile" class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-500"><svg viewBox="0 0 24 24" class="w-4 h-4 fill-current" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg></div>
    </div>
  </header>

  <main class="flex-1 overflow-auto p-6">
    <p id="admin-message" role="status" class="mb-4 text-[13px] text-gray-600"></p>
    <p id="admin-message" role="status" class="mb-4 text-[13px] text-gray-600"></p>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- Add Node Section -->
      <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
        <h3 class="text-[16px] font-bold text-gray-900 mb-4">Add monitoring node</h3>
        <form id="nodeForm" class="space-y-4">
          <div>
            <label class="form-label">Node ID (optional)</label>
            <input type="number" id="nodeId" class="form-input" placeholder="Assigned automatically">
          </div>
          <div>
            <label class="form-label">Node Name</label>
            <input type="text" id="nodeName" class="form-input" placeholder="e.g. North Forest" required>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="form-label">Latitude</label>
              <input type="number" step="any" id="nodeLat" class="form-input" placeholder="36.75" required>
            </div>
            <div>
              <label class="form-label">Longitude</label>
              <input type="number" step="any" id="nodeLng" class="form-input" placeholder="3.05" required>
            </div>
          </div>
          <p class="text-[12px] text-gray-500">Node status is calculated from its assigned sensors.</p>
          <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded-lg text-[13px] font-semibold hover:bg-blue-700 transition-colors">Register node</button>
        </form>

        <div class="mt-8">
            <h4 class="form-label">Existing Nodes</h4>
            <div id="nodeList" class="space-y-2 mt-2"></div>
        </div>
      </div>

      <!-- Add Sensor Section -->
      <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
        <h3 class="text-[16px] font-bold text-gray-900 mb-4">Add sensor</h3>
        <form id="sensorForm" class="space-y-4">
          <div>
            <label class="form-label">Sensor ID (Unique String)</label>
            <input type="text" id="sensorId" class="form-input" placeholder="e.g. node-15-temp" required>
          </div>
          <div>
            <label class="form-label">Sensor Name</label>
            <input type="text" id="sensorName" class="form-input" placeholder="e.g. Ambient Temperature" required>
          </div>
          <div>
            <label class="form-label">Assigned Node</label>
            <select id="sensorNode" class="form-input" required>
              <option value="">Select a node...</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="form-label">Type</label>
              <select id="sensorType" class="form-input">
                <option value="general">General (Generic)</option>
                <option value="temperature">Temperature</option>
                <option value="humidity">Humidity</option>
                <option value="moisture">Soil Moisture</option>
                <option value="smoke">Smoke Level</option>
              </select>
            </div>
            <div>
              <label class="form-label">Unit</label>
              <input type="text" id="sensorUnit" class="form-input" placeholder="e.g. °C, %" required>
            </div>
          </div>
          <div>
            <label class="form-label">Initial Battery %</label>
            <input type="number" id="sensorBattery" class="form-input" value="100" min="0" max="100">
          </div>
          <button type="submit" class="w-full py-2 bg-green-600 text-white rounded-lg text-[13px] font-semibold hover:bg-green-700 transition-colors">Register sensor</button>
        </form>

        <div class="mt-8">
            <h4 class="form-label">Active Sensors</h4>
            <div id="sensorList" class="space-y-2 mt-2"></div>
        </div>
      </div>

    </div>

  </main>
</div>

<script>
const API_BASE = '/api';
let nodesCache = [];

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

async function request(path, options) {
  const response = await fetch(`${API_BASE}${path}`, options);
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.detail || `Request failed (${response.status})`);
  }
  return response.status === 204 ? null : response.json();
}

function showMessage(message, isError = false) {
  const element = document.getElementById('admin-message');
  element.textContent = message;
  element.className = `mb-4 text-[13px] ${isError ? 'text-red-600' : 'text-green-700'}`;
}

async function loadNodes() {
  nodesCache = await request('/nodes');
  const select = document.getElementById('sensorNode');
  select.innerHTML = '<option value="">Select a node...</option>' +
    nodesCache.map(node => `<option value="${escapeHtml(node.name)}">${escapeHtml(node.name)}</option>`).join('');
  const list = document.getElementById('nodeList');
  list.innerHTML = nodesCache.length ? nodesCache.map(node => `
    <div id="node-item-${Number(node.id)}" class="p-3 bg-gray-50 rounded-lg border border-gray-100">
      <div class="flex items-center justify-between gap-3">
        <span class="text-[13px] font-medium">${escapeHtml(node.name)} (ID: ${Number(node.id)}) — <span class="uppercase text-[10px] font-bold text-blue-500">${escapeHtml(node.status)}</span></span>
        <div class="flex gap-2 shrink-0">
          <button type="button" data-edit-node="${Number(node.id)}" class="text-blue-600 hover:text-blue-800 text-[11px] font-bold">Edit</button>
          <button type="button" data-delete-node="${Number(node.id)}" class="text-red-600 hover:text-red-800 text-[11px] font-bold">Delete</button>
        </div>
      </div>
    </div>
  `).join('') : '<p class="text-[13px] text-gray-400">No nodes registered.</p>';
  list.querySelectorAll('[data-edit-node]').forEach(button => button.addEventListener('click', () => editNode(Number(button.dataset.editNode))));
  list.querySelectorAll('[data-delete-node]').forEach(button => button.addEventListener('click', () => deleteNode(Number(button.dataset.deleteNode))));
}

function editNode(id) {
  const node = nodesCache.find(item => Number(item.id) === id);
  if (!node) return;
  const div = document.getElementById(`node-item-${id}`);
  div.innerHTML = `
    <div class="space-y-2">
      <input type="text" id="edit-name-${id}" value="${escapeHtml(node.name)}" class="form-input text-[12px]" aria-label="Node name">
      <div class="grid grid-cols-2 gap-2">
        <input type="number" step="any" id="edit-lat-${id}" value="${Number(node.lat)}" class="form-input text-[12px]" aria-label="Latitude">
        <input type="number" step="any" id="edit-lng-${id}" value="${Number(node.lng)}" class="form-input text-[12px]" aria-label="Longitude">
      </div>
      <div class="flex gap-2 mt-2">
        <button type="button" id="save-node-${id}" class="flex-1 bg-blue-600 text-white py-1 rounded text-[11px] font-bold">Save</button>
        <button type="button" id="cancel-node-${id}" class="flex-1 bg-gray-200 text-gray-600 py-1 rounded text-[11px] font-bold">Cancel</button>
      </div>
    </div>
  `;
  document.getElementById(`save-node-${id}`).addEventListener('click', () => saveNodeEdit(id));
  document.getElementById(`cancel-node-${id}`).addEventListener('click', () => loadNodes().catch(showLoadError));
}

async function saveNodeEdit(id) {
  const data = {
    name: document.getElementById(`edit-name-${id}`).value,
    lat: parseFloat(document.getElementById(`edit-lat-${id}`).value),
    lng: parseFloat(document.getElementById(`edit-lng-${id}`).value)
  };
  try {
    await request(`/nodes/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
    await loadNodes();
    showMessage('Node updated.');
  } catch (error) {
    showMessage(error.message, true);
  }
}

async function loadSensors() {
  const sensors = await request('/sensors');
  const list = document.getElementById('sensorList');
  list.innerHTML = sensors.length ? sensors.map(sensor => `
    <div class="flex items-center justify-between gap-3 p-2 bg-gray-50 rounded-lg border border-gray-100">
      <span class="text-[13px] font-medium">${escapeHtml(sensor.name)} (${escapeHtml(sensor.id)}) @ ${escapeHtml(sensor.node)}</span>
      <button type="button" data-delete-sensor="${escapeHtml(sensor.id)}" class="text-red-600 hover:text-red-800 text-[11px] font-bold shrink-0">Delete</button>
    </div>
  `).join('') : '<p class="text-[13px] text-gray-400">No sensors registered.</p>';
  list.querySelectorAll('[data-delete-sensor]').forEach(button => button.addEventListener('click', () => deleteSensor(button.dataset.deleteSensor)));
}

async function deleteNode(id) {
  if (!confirm('Delete this node? Nodes with assigned sensors cannot be removed.')) return;
  try {
    await request(`/nodes/${id}`, { method:'DELETE' });
    await loadNodes();
    showMessage('Node deleted.');
  } catch (error) {
    showMessage(error.message, true);
  }
}

async function deleteSensor(id) {
  if (!confirm(`Delete sensor "${id}" and its stored readings?`)) return;
  try {
    await request(`/sensors/${encodeURIComponent(id)}`, { method:'DELETE' });
    await Promise.all([loadSensors(), loadNodes()]);
    showMessage('Sensor deleted.');
  } catch (error) {
    showMessage(error.message, true);
  }
}

document.getElementById('nodeForm').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.currentTarget;
  const id = document.getElementById('nodeId').value;
  const data = {
    ...(id ? { id:Number(id) } : {}),
    name: document.getElementById('nodeName').value,
    lat: Number(document.getElementById('nodeLat').value),
    lng: Number(document.getElementById('nodeLng').value)
  };
  try {
    await request('/nodes', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
    form.reset();
    await loadNodes();
    showMessage('Node registered.');
  } catch (error) {
    showMessage(error.message, true);
  }
});

document.getElementById('sensorForm').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.currentTarget;
  const data = {
    id: document.getElementById('sensorId').value,
    name: document.getElementById('sensorName').value,
    node: document.getElementById('sensorNode').value,
    type: document.getElementById('sensorType').value,
    unit: document.getElementById('sensorUnit').value,
    battery: document.getElementById('sensorBattery').value,
    status: 'normal'
  };
  try {
    await request('/sensors', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
    form.reset();
    document.getElementById('sensorBattery').value = '100';
    await Promise.all([loadSensors(), loadNodes()]);
    showMessage('Sensor registered.');
  } catch (error) {
    showMessage(error.message, true);
  }
});

function showLoadError(error) {
  showMessage('Unable to load administration data. ' + error.message, true);
  console.error(error);
}

Promise.all([loadNodes(), loadSensors()]).catch(showLoadError);
</script>
</body>
</html>
